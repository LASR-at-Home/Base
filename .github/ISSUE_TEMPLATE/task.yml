name: Task / To-Do
description: Log a new task, feature request, or piece of work that needs to be done.
title: "[Task]: "
labels: ["Task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to log upcoming work, tasks, or features.
  - type: textarea
    id: task_description
    attributes:
      label: Task Description
      description: A clear and concise description of what needs to be done.
      placeholder: We need to implement...
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Why is this needed?
      description: Explain the context or the problem this task solves.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Definition of Done (Acceptance Criteria)
      description: How will we know this task is complete?
      placeholder: |
        - [ ] Feature X is implemented
        - [ ] Code is tested
        - [ ] Documentation is updated
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, references, or mockups here.