# S8: like a real robot test: the host stands ~1.3 m in front of the robot until it has
# locked on and started, then walks off at normal walking pace (1.0 m/s) straight away,
# later slowing down. World frame.
test_person:
  start: {x: 2.1, y: -0.2, yaw: 0.0}
  steps:
    - {pause: 8.0}
    - {x: 4.4, y: -1.0, speed: 1.0}
    - {x: 5.8, y: -1.0, speed: 1.0}
    - {x: 6.8, y: -2.6, speed: 0.7}
    - {x: 11.5, y: -2.8, speed: 0.7}
