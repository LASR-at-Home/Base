/**:
  ros__parameters:
    pick_and_place:

      # Category the referee designates as trash.
      trash_category: "trash"

      # objects: ["cup", "can", "bottle", "bowl", "box", "apple", "fork",
      #           "knife", "spoon", "plate"]

      # DINING TABLE
      table:
        # Where the robot stands to pick objects from the table
        pose:
          position: {x: 0.5444910497763044, y: -2.4412505621588583, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: -0.7912741117828641, w: 0.6114615932519716}

        # # Where the robot stands to observe/detect the full table
        # observe_pose:
        #   position: {x: 0.5876252953308133, y: -1.0687492206833655, z: 0.0}
        #   orientation: {x: 0.0, y: 0.0, z: 0.996990359390238, w: 0.07752562984538826}

        # Detection polygon — rectangle around the table top in map frame
        polygon:
          top_left:     [3.5, 3.5]
          top_right:    [5.5, 3.5]
          bottom_right: [5.5, 1.0]
          bottom_left:  [3.5, 1.0]

        # # Search polygon for FindAndGoToTable — larger than detection polygon
        # search_polygon:
        #   top_left:     [5.3, 5.9]
        #   top_right:    [7.8, 5.9]
        #   bottom_right: [7.8, 3.8]
        #   bottom_left:  [5.3, 3.8]

        # Z height range for detection filtering
        z_min: 0.7
        z_max: 1.5

        # MoveIt collision box for the table
        collision:
          detect: true
          frame_id: map
          size: [1.02, 1.2, 0.9]
          position: [1.2, -3.9, 0.37]

      # DESTINATION 1: dishwasher
      dishwasher:
        pose:
          position: {x: 0.821, y: 0.299, z: 0.0}   # update with real pose
          orientation: {x: 0.0, y: 0.0, z: -0.7527398351858691, w: 0.6583181149902764}

      # DESTINATION 2: trash bin
      trash_bin:
        pose:
          position: {x: 0.0, y: 0.0, z: 0.0}       # update with real pose
          orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

      # DESTINATION 3: cabinet
      cabinet:
        pose:
          position: {x: -0.24395824472217295, y: -1.7992161774429396, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.9801022379942061, w: 0.13519825869117716}

        # Detection polygon for cereal/milk detection inside cabinet
        polygon:
          top_left:     [0.0, 0.0]
          top_right:    [1.0, 0.0]
          bottom_right: [1.0, 1.0]
          bottom_left:  [0.0, 1.0]

        # Shelves — used by ScanShelves
        shelf_order: ["top", "middle", "bottom"]
        shelves:
          top:
            torso_lift_joint: 0.30
            look_point: [0.0, 0.0, 1.0]
            polygon:
              top_left:     [0.0, 0.0]
              top_right:    [1.0, 0.0]
              bottom_right: [1.0, 1.0]
              bottom_left:  [0.0, 1.0]
            z_min: 0.9
            z_max: 1.3
          middle:
            torso_lift_joint: 0.15
            look_point: [0.0, 0.0, 0.7]
            polygon:
              top_left:     [0.0, 0.0]
              top_right:    [1.0, 0.0]
              bottom_right: [1.0, 1.0]
              bottom_left:  [0.0, 1.0]
            z_min: 0.6
            z_max: 0.9
          bottom:
            torso_lift_joint: 0.0
            look_point: [0.0, 0.0, 0.4]
            polygon:
              top_left:     [0.0, 0.0]
              top_right:    [1.0, 0.0]
              bottom_right: [1.0, 1.0]
              bottom_left:  [0.0, 1.0]
            z_min: 0.3
            z_max: 0.6

      # BREAKFAST SURFACE (bowl and spoon pickup location)
      breakfast_surface:
        pose:
          position: {x: 0.5444910497763044, y: -2.4412505621588583, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: -0.7912741117828641, w: 0.6114615932519716}
        # update with real coordinates
        polygon:
          top_left:     [0.0, 0.0]
          top_right:    [1.0, 0.0]
          bottom_right: [1.0, 1.0]
          bottom_left:  [0.0, 1.0]

      # EXTRA SURFACE (two common objects for cleanup)
      extra_surface:
        pose:
          position: {x: 0.0, y: 0.0, z: 0.0}       # update with real pose
          orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
        # update with real coordinates
        polygon:
          top_left:     [0.0, 0.0]
          top_right:    [1.0, 0.0]
          bottom_right: [1.0, 1.0]
          bottom_left:  [0.0, 1.0]

      # GRASP (not used without manipulation)
      grasp:
        enable: false
        reach: 0.80
        use_moveit: false
        publish_box: false

