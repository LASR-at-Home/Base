pick_and_place:
  ros__parameters:
    pick_and_place:

      # Category the referee designates as trash.
      trash_category: "fruit"

      # DINING TABLE
      table:
        # Where the robot stands to pick objects from the table yes
        pose:
          position: {x: 18.286640167236328, y: 17.158531188964844, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.23475679324648935, w: 0.9720541384226626}

        # Detection polygon — rectangle around the table top in map frame yes
        polygon:
          top_left:     [19.895475387573242, 19.565929412841797]
          top_right:    [20.75072479248047, 17.910919189453125]
          bottom_right: [19.231399536132812, 17.308053970336914]
          bottom_left:  [18.61876678466797, 18.782747268676758]

        # Z height range for detection filtering
        z_min: 0.7
        z_max: 1.5

        # MoveIt collision box for the table
        collision:
          detect: true
          frame_id: map
          size: [1.02, 1.2, 0.9]
          position: [1.2, -3.9, 0.37]

      # DESTINATION 1: dishwasher yes
      dishwasher:
        pose:
          position: {x: 21.083377838134766, y: 17.50518798828125, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.6302277804689937, w: 0.7764102940617968}

      # DESTINATION 2: trash bin yes
      trash_bin:
        pose:
          position: {x: 17.97636604309082, y: 18.296886444091797, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: 0.4672978824654963, w: 0.8840999315932918}

      # DESTINATION 3: cabinet yes
      cabinet:
        pose:
          position: {x: -17.60262680053711, y: 17.752120971679688, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: -0.7787013983443649, w: 0.6273947180336561}

        # Detection polygon for cereal/milk detection inside cabinet (from real)
        polygon:
          top_left:     [17.650035858154297, 16.498868942260742]
          top_right:    [16.620262145996094, 16.745742797851562]
          bottom_right: [16.77428436279297, 17.151657104492188]
          bottom_left:  [17.719106674194336, 17.719106674194336]

        # Shelves — used by ScanShelves also from real
        shelf_order: ["top", "middle", "bottom", "extra_bottom"]
        shelves:
          top:
            torso_lift_joint: 0.30
            look_point: [17.099706649780273, 16.77971076965332, 1.1333880424499519]
            polygon:
              top_left:     [17.650035858154297, 16.498868942260742]
              top_right:    [16.620262145996094, 16.745742797851562]
              bottom_right: [16.77428436279297, 17.151657104492188]
              bottom_left:  [17.719106674194336, 17.719106674194336]
              z_min: 1.05
            z_max: 1.40

          middle:
            torso_lift_joint: 0.15
            look_point: [17.099706649780273, 16.77971076965332, 0.72]
            polygon:
              top_left:     [17.650035858154297, 16.498868942260742]
              top_right:    [16.620262145996094, 16.745742797851562]
              bottom_right: [16.77428436279297, 17.151657104492188]
              bottom_left:  [17.719106674194336, 17.719106674194336]
            z_min: 0.60
            z_max: 0.95

          bottom:
            torso_lift_joint: 0.0
            look_point: [17.099706649780273, 16.77971076965332, 0.38]
            polygon:
              top_left:     [17.650035858154297, 16.498868942260742]
              top_right:    [16.620262145996094, 16.745742797851562]
              bottom_right: [16.77428436279297, 17.151657104492188]
              bottom_left:  [17.719106674194336, 17.719106674194336]
            z_min: 0.25
            z_max: 0.60

          extra_bottom:
            torso_lift_joint: 0.0
            look_point: [17.099706649780273, 16.77971076965332, 0.12]
            polygon:
              top_left:     [17.650035858154297, 16.498868942260742]
              top_right:    [16.620262145996094, 16.745742797851562]
              bottom_right: [16.77428436279297, 17.151657104492188]
              bottom_left:  [17.719106674194336, 17.719106674194336]
            z_min: 0.0
            z_max: 0.25

      # BREAKFAST SURFACE (bowl and spoon pickup location)
      breakfast_surface:
        pose:
          position: {x: -6.90986967086792, y: 21.280567169189453, z: 0.0}
          orientation: {x: 0.0, y: 0.0, z: -0.125551, w: 0.992087}
        # update with real coordinates
        polygon:
          top_left:     [-5.61154317855835, 21.451658248901367]
          top_right:    [-5.85907506942749, 20.46249008178711]
          bottom_right: [-6.411557197570801, 20.629091262817383]
          bottom_left:  [-6.269176006317139, 21.64197540283203]

      # EXTRA SURFACE (two common objects for cleanup)
      extra_surface:
        pose:
          position: {x: -6.90986967086792, y: 21.280567169189453, z: 0.0}       # update with real pose
          orientation: {x: 0.0, y: 0.0, z: -0.125551, w: 0.992087}
        # update with real coordinates
