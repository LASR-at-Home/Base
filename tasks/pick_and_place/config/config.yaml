pick_and_place:
  table:
    # Robot standing in front of table (approaching from +y side)
    pose:
      position: {x: 6.33, y: 5.9, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: -0.707, w: 0.707}

    # Table surface centre
    look_point: [6.55, 4.82, 0.75]

    # Tight polygon matching actual table dimensions
    polygon: [5.80, 4.37, 7.30, 4.37, 7.30, 5.27, 5.80, 5.27]

    # Larger search polygon for FindAndGoToTable
    search_polygon: [5.3, 3.8, 7.8, 3.8, 7.8, 5.9, 5.3, 5.9]

    # z bounds for detection
    z_min: 0.7
    z_max: 1.5
