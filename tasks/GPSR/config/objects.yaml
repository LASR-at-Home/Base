# Object fields:
#   category:  singular category (snack, drink, food, dish, ...). Commands may use the
#              singular or plural form ("drinks"); plural is derived automatically.
#   location:  default sub-location (must be a key in locations.yaml)
#   size:      small / medium / large - proxy for heaviest / lightest
#   aliases:   other spoken names for the object
#   detect_as: COCO classes yolo11n-seg reports this object as. Objects that are not a
#              COCO class (cans, tubes, boxes) are only found through this list.
#              Several objects may share a class, e.g. coke / pringles / paper_cup
#              are all seen as "cup", so a single-object search cannot tell them apart.
# Names use underscores (spoken as spaces) to match the RoboCup command generator.

objects: # Lab Testing
  # --- snacks (study table in office) ---
  pringles:
    category: snack
    location: study table
    grabbable: true
    size: small
    aliases: [crisps, chips]
    detect_as: [cup, bottle]     # tube - not a COCO class

  # --- drinks (dining table in living room) ---
  coke:
    category: drink
    location: dining table
    grabbable: true
    size: small
    aliases: [coca cola, cola, soda]
    detect_as: [cup, bottle]     # can - not a COCO class
  water_bottle:
    category: drink
    location: dining table
    grabbable: true
    size: medium
    aliases: [water]
    detect_as: [bottle]

  # --- food (tv stand in living room) ---
  cereal:
    category: food
    location: tv stand
    grabbable: true
    size: medium
    aliases: [cereal box, cornflakes]
    detect_as: [book]            # box - not a COCO class; CHECK on the real object

  # --- dishes (computer desk in office) ---
  spoon:
    category: dish
    location: computer desk
    grabbable: true
    size: small
    aliases: [tablespoon, table spoon]
    detect_as: [spoon, knife]    # often seen as knife at low confidence
  paper_cup:
    category: dish
    location: computer desk
    grabbable: true
    size: small
    aliases: []
    detect_as: [cup]
